server {
    listen 8443 ssl;
    server_name tr.spb.ru;

    ssl_certificate     /etc/letsencrypt/live/tr.spb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tr.spb.ru/privkey.pem;

    location /sudoku/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /sudoku/index.html;

        location = /sudoku/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    location /sudoku/assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        return 301 /sudoku/;
    }
}